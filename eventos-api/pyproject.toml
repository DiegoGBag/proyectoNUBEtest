[project]
name = "eventos-api"
version = "0.2.0"
description = "Backend FastAPI para la plataforma Events (SQL Server)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "sqlalchemy>=2.0,<2.1",
    "pyodbc>=5.1,<6.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "email-validator>=2.0,<3.0",
    "pyjwt>=2.0,<3.0",
    "bcrypt>=4.0,<5.0",
]
